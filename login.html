<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ham Earn</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:32px;
    border-radius:18px;
    border:1px solid #e4e8ed;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:27px;
    font-weight:bold;
    color:#087443;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#697480;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d8dde4;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#087443;
}

.login-submit{
    width:100%;
    margin-top:25px;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#087443;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.login-submit:hover{
    background:#065d35;
}

.error{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#fff1ef;
    color:#c0392b;
    font-size:13px;
}

.success{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#eaf7f0;
    color:#087443;
    font-size:13px;
}

.register-link{
    text-align:center;
    margin-top:20px;
    color:#697480;
}

.register-link a{
    color:#087443;
    font-weight:bold;
    text-decoration:none;
}

.home-link{
    display:block;
    text-align:center;
    margin-top:12px;
    color:#68737f;
    text-decoration:none;
    font-size:14px;
}

.notice{
    margin-top:20px;
    padding:10px;
    background:#fff8e6;
    border-radius:8px;
    color:#806500;
    font-size:12px;
    text-align:center;
}

.password-row{
    position:relative;
}

.password-row input{
    padding-right:75px;
}

.show-password{
    position:absolute;
    right:8px;
    top:7px;
    height:38px;
    padding:0 10px;
    border:none;
    background:#f0f3f5;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    color:#087443;
    font-weight:bold;
}

@media(max-width:450px){

    .login-box{
        padding:24px;
    }

}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        🇵🇰 Ham Earn
    </div>

    <div class="subtitle">
        Login to your account
    </div>


    <form onsubmit="loginUser(event)">

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label>
            Password
        </label>

        <div class="password-row">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()"
                id="showBtn"
            >
                Show
            </button>

        </div>


        <div
            class="error"
            id="error">
        </div>


        <div
            class="success"
            id="success">
        </div>


        <button
            type="submit"
            class="login-submit"
            id="loginButton"
        >
            Login
        </button>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <a
        href="index.html"
        class="home-link">

        ← Back to Home

    </a>


    <div class="notice">

        Demo system — account data is stored
        locally in this browser.

    </div>

</div>


<script>

/* =========================================
   PASSWORD HASH
========================================= */

async function hashPassword(password){

    const data =
        new TextEncoder().encode(password);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array.from(
        new Uint8Array(hash)
    )
    .map(
        byte =>
        byte.toString(16).padStart(2,"0")
    )
    .join("");

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(message){

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    success.style.display="none";

    error.innerText=message;

    error.style.display="block";

}


/* =========================================
   SHOW SUCCESS
========================================= */

function showSuccess(message){

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    error.style.display="none";

    success.innerText=message;

    success.style.display="block";

}


/* =========================================
   TOGGLE PASSWORD
========================================= */

function togglePassword(){

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("showBtn");


    if(password.type==="password"){

        password.type="text";

        button.innerText="Hide";

    }else{

        password.type="password";

        button.innerText="Show";

    }

}


/* =========================================
   LOGIN
========================================= */

async function loginUser(event){

    event.preventDefault();


    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        document.getElementById("password")
        .value;


    const loginButton =
        document.getElementById("loginButton");


    if(!email || !password){

        showError(
            "Please enter email and password."
        );

        return;

    }


    loginButton.disabled=true;

    loginButton.innerText="Checking...";


    try{

        /* GET USERS */

        let users =
            JSON.parse(
                localStorage.getItem(
                    "Ham EarnUsers"
                ) || "[]"
            );


        if(!Array.isArray(users)){

            users=[];

        }


        /* FIND USER */

        const user =
            users.find(
                item =>
                String(item.email || "")
                .trim()
                .toLowerCase()
                === email
            );


        if(!user){

            showError(
                "No account found with this email."
            );

            loginButton.disabled=false;

            loginButton.innerText="Login";

            return;

        }


        /* HASH ENTERED PASSWORD */

        const passwordHash =
            await hashPassword(password);


        /* CHECK PASSWORD */

        if(
            String(user.password || "")
            !== passwordHash
        ){

            showError(
                "Incorrect password. Please try again."
            );

            loginButton.disabled=false;

            loginButton.innerText="Login";

            return;

        }


        /* =================================
           LOGIN SUCCESS
        ================================= */

        localStorage.setItem(
            "loggedInUser",
            String(user.id)
        );


        showSuccess(
            "Login successful! Opening dashboard..."
        );


        setTimeout(
            function(){

                window.location.href=
                    "dashboard.html";

            },
            500
        );


    }catch(error){

        console.error(error);

        showError(
            "Something went wrong. Please try again."
        );

        loginButton.disabled=false;

        loginButton.innerText="Login";

    }

}


/* =========================================
   ENTER KEY
========================================= */

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            event.preventDefault();

            document
            .querySelector("form")
            .requestSubmit();

        }

    }
);

</script>

</body>
</html>
