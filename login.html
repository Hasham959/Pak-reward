<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - PakReward</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;

    background: white;

    padding: 32px;

    border-radius: 18px;

    border: 1px solid #e4e8ed;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #087443;

    margin-bottom: 8px;
}

.subtitle {
    text-align: center;

    color: #697480;

    margin-bottom: 25px;
}

label {
    display: block;

    margin-top: 15px;
    margin-bottom: 6px;

    font-weight: bold;

    font-size: 14px;
}

input {
    width: 100%;

    padding: 13px;

    border: 1px solid #d8dde4;

    border-radius: 8px;

    font-size: 15px;

    outline: none;
}

input:focus {
    border-color: #087443;
}

.password-row {
    position: relative;
}

.password-row input {
    padding-right: 75px;
}

.show-password {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    color: #087443;

    font-weight: bold;

    cursor: pointer;
}

.login-btn {
    width: 100%;

    margin-top: 25px;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background: #087443;

    color: white;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;
}

.login-btn:hover {
    opacity: 0.9;
}

.login-btn:disabled {
    background: #8aa99a;
    cursor: not-allowed;
}

.register-link {
    text-align: center;

    margin-top: 20px;

    color: #697480;
}

.register-link a {
    color: #087443;

    font-weight: bold;

    text-decoration: none;
}

.home-link {
    display: block;

    text-align: center;

    margin-top: 12px;

    color: #68737f;

    text-decoration: none;

    font-size: 14px;
}

.error {
    color: #c0392b;

    font-size: 13px;

    margin-top: 10px;

    display: none;

    background: #fff1ef;

    padding: 9px;

    border-radius: 7px;
}

.success {
    color: #087443;

    font-size: 13px;

    margin-top: 10px;

    display: none;

    background: #eaf7f0;

    padding: 9px;

    border-radius: 7px;
}

.notice {
    margin-top: 18px;

    padding: 10px;

    background: #fff8e6;

    border-radius: 8px;

    color: #806500;

    font-size: 12px;

    text-align: center;
}

</style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        🇵🇰 PakReward
    </div>


    <div class="subtitle">
        Login to your account
    </div>


    <form onsubmit="loginUser(event)">


        <label>
            Email
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label>
            Password
        </label>


        <div class="password-row">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <button
                type="button"
                class="show-password"
                onclick="togglePassword()">

                Show

            </button>

        </div>


        <div
            class="error"
            id="error">
        </div>


        <div
            class="success"
            id="success">
        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginButton">

            Login

        </button>


    </form>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <a
        href="index.html"
        class="home-link">

        ← Back to Home

    </a>


    <div class="notice">

        Demo login system.
        Account data is stored locally in this browser.

    </div>


</div>


<script>


/* =========================
   HASH PASSWORD
========================= */

async function hashPassword(password) {

    const data =
        new TextEncoder().encode(password);


    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );


    return Array.from(
        new Uint8Array(hash)
    )
    .map(
        byte =>
        byte.toString(16)
            .padStart(2, "0")
    )
    .join("");

}


/* =========================
   SHOW ERROR
========================= */

function showError(message) {

    const error =
        document.getElementById("error");

    error.innerText = message;

    error.style.display = "block";

}


/* =========================
   SHOW SUCCESS
========================= */

function showSuccess(message) {

    const success =
        document.getElementById("success");

    success.innerText = message;

    success.style.display = "block";

}


/* =========================
   LOGIN USER
========================= */

async function loginUser(event) {

    event.preventDefault();


    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        document.getElementById("password")
        .value;


    const error =
        document.getElementById("error");


    const success =
        document.getElementById("success");


    const loginButton =
        document.getElementById("loginButton");


    error.style.display = "none";

    success.style.display = "none";


    /* Get users */

    let users =
        JSON.parse(
            localStorage.getItem(
                "pakrewardUsers"
            ) || "[]"
        );


    /* Check account */

    const user =
        users.find(
            item =>
            item.email === email
        );


    if (!user) {

        showError(
            "No account found with this email."
        );

        return;

    }


    /* Hash password */

    const passwordHash =
        await hashPassword(password);


    /* Check password */

    if (
        user.password !== passwordHash
    ) {

        showError(
            "Incorrect password. Please try again."
        );

        return;

    }


    /* Save login session */

    localStorage.setItem(
        "loggedInUser",
        String(user.id)
    );


    /* Save current user values */

    localStorage.setItem(
        "balance",
        String(user.balance || 0)
    );


    localStorage.setItem(
        "todayReward",
        String(user.todayReward || 0)
    );


    localStorage.setItem(
        "totalReward",
        String(user.totalReward || 0)
    );


    localStorage.setItem(
        "selectedPlan",
        user.selectedPlan || ""
    );


    localStorage.setItem(
        "planAmount",
        String(user.planAmount || 0)
    );


    localStorage.setItem(
        "adsCompleted",
        String(user.adsCompleted || 0)
    );


    showSuccess(
        "Login successful! Opening dashboard..."
    );


    loginButton.disabled = true;

    loginButton.innerText =
        "Opening Dashboard...";


    setTimeout(function() {

        window.location.href =
            "dashboard.html";

    }, 700);

}


/* =========================
   SHOW / HIDE PASSWORD
========================= */

function togglePassword() {

    const password =
        document.getElementById("password");


    const button =
        document.querySelector(".show-password");


    if (password.type === "password") {

        password.type = "text";

        button.innerText = "Hide";

    }

    else {

        password.type = "password";

        button.innerText = "Show";

    }

}

</script>


</body>

</html>
