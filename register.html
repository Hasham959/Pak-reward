<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - PakReward</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}

.register-box {

    width: 100%;
    max-width: 430px;

    background: white;

    padding: 32px;

    border-radius: 18px;

    box-shadow: 0 10px 35px rgba(0,0,0,0.08);

    border: 1px solid #e4e8ed;
}

.logo {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #087443;

    margin-bottom: 8px;
}

.subtitle {

    text-align: center;

    color: #697480;

    margin-bottom: 25px;
}

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 6px;

    font-weight: bold;

    font-size: 14px;
}

input {

    width: 100%;

    padding: 13px;

    border: 1px solid #d8dde4;

    border-radius: 8px;

    font-size: 15px;

    outline: none;
}

input:focus {

    border-color: #087443;
}

.register-btn {

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background: #087443;

    color: white;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;
}

.register-btn:hover {

    opacity: 0.9;
}

.login-link {

    text-align: center;

    margin-top: 20px;

    color: #697480;
}

.login-link a {

    color: #087443;

    font-weight: bold;

    text-decoration: none;
}

.notice {

    margin-top: 18px;

    padding: 10px;

    background: #fff8e6;

    border-radius: 8px;

    color: #806500;

    font-size: 12px;

    text-align: center;
}

</style>
</head>


<body>

<div class="register-box">

    <div class="logo">
        🇵🇰 PakReward
    </div>

    <div class="subtitle">
        Create your account
    </div>


    <form onsubmit="registerDemo(event)">

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >


        <label>Mobile Number</label>

        <input
            type="tel"
            id="mobile"
            placeholder="03XXXXXXXXX"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            required
        >


        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required
        >


        <button
            type="submit"
            class="register-btn"
        >
            Create Account
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="index.html">
            Login
        </a>

    </div>


    <div class="notice">

        Demo registration only.
        No real account or payment is created yet.

    </div>

</div>


<script>

function registerDemo(event) {

    event.preventDefault();


    let name =
        document.getElementById("name").value;

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;

    }


    alert(
        "Registration successful!\n\n" +
        "Welcome " + name + "!"
    );


    window.location.href =
        "dashboard.html";

}

</script>

</body>
</html>
