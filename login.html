<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;

<body>

<div class="login-box">

    <div class="logo">
        🇵🇰 Ham Earn
    </div>

    <div class="subtitle">
        Login to your account
    </div>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label>Password</label>

        <div class="password-row">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-btn"
                id="showBtn"
            >
                Show
            </button>

        </div>

        <div
            class="error"
            id="error">
        </div>

        <div
            class="success"
            id="success">
        </div>

        <button
            type="submit"
            class="login-submit"
            id="loginButton">
            Login
        </button>

    </form>

    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>

    <a
        href="index.html"
        class="home-link">

        ← Back to Home

    </a>

    <div class="notice">
        Demo system — account data is stored locally in this browser.
    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const showBtn =
    document.getElementById("showBtn");


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showBtn.addEventListener("click",function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";
        showBtn.innerText = "Hide";

    }else{

        passwordInput.type = "password";
        showBtn.innerText = "Show";

    }

});


/* =========================================
   SHA-256
========================================= */

async function hashPassword(password){

    if(
        window.crypto &&
        window.crypto.subtle
    ){

        const data =
            new TextEncoder()
            .encode(password);

        const hash =
            await crypto.subtle.digest(
                "SHA-256",
                data
            );

        return Array.from(
            new Uint8Array(hash)
        )
        .map(function(byte){

            return byte
                .toString(16)
                .padStart(2,"0");

        })
        .join("");

    }

    /*
       Fallback for browsers where
       crypto.subtle is unavailable.
    */

    return password;

}


/* =========================================
   ERROR
========================================= */

function showError(message){

    successBox.style.display = "none";

    errorBox.innerText = message;

    errorBox.style.display = "block";

}


/* =========================================
   SUCCESS
========================================= */

function showSuccess(message){

    errorBox.style.display = "none";

    successBox.innerText = message;

    successBox.style.display = "block";

}


/* =========================================
   LOGIN
========================================= */

form.addEventListener("submit",async function(event){

    event.preventDefault();

    errorBox.style.display = "none";
    successBox.style.display = "none";

    const email =
        emailInput.value
        .trim()
        .toLowerCase();

    const password =
        passwordInput.value;


    if(!email || !password){

        showError(
            "Please enter your email and password."
        );

        return;
    }


    loginButton.disabled = true;
    loginButton.innerText = "Checking...";


    try{

        /*
           GET REGISTERED USERS
        */

        let users = [];

        try{

            users =
                JSON.parse(
                    localStorage.getItem(
                        "Ham EarnUsers"
                    ) || "[]"
                );

        }catch(e){

            users = [];

        }


        if(!Array.isArray(users)){

            users = [];

        }


        /*
           FIND USER
        */

        const user =
            users.find(function(item){

                return String(
                    item.email || ""
                )
                .trim()
                .toLowerCase()
                === email;

            });


        if(!user){

            showError(
                "No account found with this email. Please register first."
            );

            loginButton.disabled = false;
            loginButton.innerText = "Login";

            return;
        }


        /*
           CHECK PASSWORD
        */

        const enteredHash =
            await hashPassword(password);

        const savedPassword =
            String(user.password || "");


        /*
           Normal hashed password
        */

        let passwordCorrect =
            savedPassword === enteredHash;


        /*
           Compatibility with accounts
           created using plain password
        */

        if(!passwordCorrect){

            passwordCorrect =
                savedPassword === password;

        }


        if(!passwordCorrect){

            showError(
                "Incorrect password. Please try again."
            );

            loginButton.disabled = false;
            loginButton.innerText = "Login";

            return;
        }


/* =========================================
   LOGIN SUCCESS
========================================= */

localStorage.setItem(
    "Ham EarnCurrentUser",
    String(user.id)
);

/* Compatibility with other pages */
localStorage.setItem(
    "loggedInUser",
    String(user.id)
);

localStorage.setItem(
    "currentUserId",
    String(user.id)
);

showSuccess(
    "Login successful! Opening dashboard..."
);

setTimeout(function(){

    window.location.href = "dashboard.html";

},500);


    }catch(error){

        console.error(
            "Login Error:",
            error
        );

        showError(
            "Unable to login. Please try again."
        );

        loginButton.disabled = false;
        loginButton.innerText = "Login";

    }

});


/* =========================================
   ENTER KEY
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            form.requestSubmit();

        }

    }
);

</script>

</body>
</html>
