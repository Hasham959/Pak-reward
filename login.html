<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - PakReward</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f5f7fb;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.login-box {

    width: 100%;

    max-width: 430px;

    background: white;

    padding: 32px;

    border-radius: 18px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.08);

    border: 1px solid #e4e8ed;

}


.logo {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #087443;

    margin-bottom: 8px;

}


.subtitle {

    text-align: center;

    color: #697480;

    margin-bottom: 25px;

}


label {

    display: block;

    margin-top: 15px;

    margin-bottom: 6px;

    font-weight: bold;

    font-size: 14px;

}


input {

    width: 100%;

    padding: 13px;

    border: 1px solid #d8dde4;

    border-radius: 8px;

    font-size: 15px;

    outline: none;

}


input:focus {

    border-color: #087443;

}


.login-btn {

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background: #087443;

    color: white;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;

}


.login-btn:hover {

    opacity: 0.9;

}


.register-link {

    text-align: center;

    margin-top: 20px;

    color: #697480;

}


.register-link a {

    color: #087443;

    font-weight: bold;

    text-decoration: none;

}


.error {

    color: #c0392b;

    background: #fdecea;

    padding: 10px;

    border-radius: 8px;

    font-size: 13px;

    margin-top: 15px;

    display: none;

    text-align: center;

}


.notice {

    margin-top: 18px;

    padding: 10px;

    background: #fff8e6;

    border-radius: 8px;

    color: #806500;

    font-size: 12px;

    text-align: center;

}

</style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        🇵🇰 PakReward
    </div>


    <div class="subtitle">
        Login to your account
    </div>



    <form onsubmit="loginUser(event)">


        <label>
            Email
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >



        <label>
            Password
        </label>


        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >



        <div
            class="error"
            id="error">
        </div>



        <button
            type="submit"
            class="login-btn">

            Login

        </button>


    </form>



    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>



    <div class="notice">

        Demo login system.
        Account data is stored locally in this browser.

    </div>


</div>



<script>


/* =========================
   HASH PASSWORD
========================= */

async function hashPassword(password) {

    const data =
        new TextEncoder()
            .encode(password);


    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );


    return Array.from(
        new Uint8Array(hash)
    )
    .map(
        byte =>
        byte.toString(16)
            .padStart(2, "0")
    )
    .join("");

}



/* =========================
   SHOW ERROR
========================= */

function showError(message) {

    const error =
        document.getElementById(
            "error"
        );


    error.innerText =
        message;


    error.style.display =
        "block";

}



/* =========================
   LOGIN USER
========================= */

async function loginUser(event) {

    event.preventDefault();


    const email =
        document.getElementById(
            "email"
        ).value.trim()
        .toLowerCase();


    const password =
        document.getElementById(
            "password"
        ).value;


    const users =
        JSON.parse(
            localStorage.getItem(
                "pakrewardUsers"
            ) || "[]"
        );


    /* Find User */

    const user =
        users.find(
            account =>
            account.email === email
        );


    if (!user) {

        showError(
            "No account found with this email."
        );

        return;

    }


    /* Hash Entered Password */

    const passwordHash =
        await hashPassword(
            password
        );


    /* Check Password */

    if (
        passwordHash !==
        user.password
    ) {

        showError(
            "Incorrect password."
        );

        return;

    }


    /* Create Login Session */

    localStorage.setItem(
        "loggedInUser",
        String(user.id)
    );


    /* Load User Data */

    localStorage.setItem(
        "balance",
        String(user.balance || 0)
    );


    localStorage.setItem(
        "todayReward",
        String(user.todayReward || 0)
    );


    localStorage.setItem(
        "totalReward",
        String(user.totalReward || 0)
    );


    localStorage.setItem(
        "selectedPlan",
        user.selectedPlan || ""
    );


    localStorage.setItem(
        "planAmount",
        String(user.planAmount || 0)
    );


    localStorage.setItem(
        "adsCompleted",
        String(user.adsCompleted || 0)
    );


    /* Login Success */

    alert(
        "Login successful!\n\n" +
        "Welcome back, " +
        user.name +
        "!"
    );


    window.location.href =
        "dashboard.html";

}

</script>


</body>

</html>
