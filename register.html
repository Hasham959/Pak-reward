<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Ham Earn</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.register-box{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:32px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
    border:1px solid #e4e8ed;
}

.logo{
    text-align:center;
    font-size:27px;
    font-weight:bold;
    color:#087443;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#697480;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d8dde4;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#087443;
    box-shadow:0 0 0 2px rgba(8,116,67,.08);
}

.register-btn{
    width:100%;
    margin-top:25px;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#087443;
    color:#fff;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.register-btn:hover{
    background:#075f37;
}

.register-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#697480;
}

.login-link a{
    color:#087443;
    font-weight:bold;
    text-decoration:none;
}

.home-link{
    display:block;
    text-align:center;
    margin-top:12px;
    color:#68737f;
    text-decoration:none;
    font-size:14px;
}

.notice{
    margin-top:18px;
    padding:10px;
    background:#fff8e6;
    border-radius:8px;
    color:#806500;
    font-size:12px;
    text-align:center;
}

.error{
    color:#c0392b;
    font-size:13px;
    margin-top:10px;
    display:none;
    background:#fff1ef;
    padding:10px;
    border-radius:7px;
}

.success{
    color:#087443;
    font-size:13px;
    margin-top:10px;
    display:none;
    background:#eaf7f0;
    padding:10px;
    border-radius:7px;
}

.referral-box{
    background:#eaf7f0;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
    color:#087443;
    font-size:13px;
}

.firebase-status{
    text-align:center;
    font-size:12px;
    margin-top:10px;
    color:#087443;
}

@media(max-width:500px){

    .register-box{
        padding:25px 20px;
    }

}

</style>

</head>

<body>


<div class="register-box">

    <div class="logo">
        🇵🇰 Ham Earn
    </div>

    <div class="subtitle">
        Create your account
    </div>


    <form id="registerForm">


        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
        >


        <label>Mobile Number</label>

        <input
            type="tel"
            id="mobile"
            placeholder="03XXXXXXXXX"
            maxlength="11"
            inputmode="numeric"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            minlength="6"
            autocomplete="new-password"
            required
        >


        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            minlength="6"
            autocomplete="new-password"
            required
        >


        <label>Referral Code</label>

        <input
            type="text"
            id="referralCode"
            placeholder="Enter referral code (optional)"
        >


        <div class="referral-box">
            💰 Referral reward: Rs. 100
        </div>


        <div class="error" id="error"></div>

        <div class="success" id="success"></div>


        <button
            type="submit"
            class="register-btn"
            id="registerButton">

            Create Account

        </button>

    </form>


    <div class="firebase-status" id="firebaseStatus">
        Connecting to Firebase...
    </div>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <a
        href="index.html"
        class="home-link">

        ← Back to Home

    </a>


    <div class="notice">
        Ham Earn Secure Registration
    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyD4pjKrlopXvk4peRnyid4DEItpPmU993Y",

    authDomain:
        "ham-earn.firebaseapp.com",

    databaseURL:
        "https://ham-earn-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "ham-earn",

    storageBucket:
        "ham-earn.firebasestorage.app",

    messagingSenderId:
        "411688505536",

    appId:
        "1:411688505536:web:c97f891314ee6f0dd65d25",

    measurementId:
        "G-J75NF5T10H"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("registerForm");

const nameInput =
    document.getElementById("name");

const mobileInput =
    document.getElementById("mobile");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const referralInput =
    document.getElementById("referralCode");

const button =
    document.getElementById("registerButton");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const statusBox =
    document.getElementById("firebaseStatus");


/* =====================================================
   FIREBASE STATUS
===================================================== */

statusBox.innerText =
    "✓ Firebase connected";

statusBox.style.color =
    "#087443";


/* =====================================================
   MESSAGE FUNCTIONS
===================================================== */

function showError(message){

    successBox.style.display =
        "none";

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


function showSuccess(message){

    errorBox.style.display =
        "none";

    successBox.innerText =
        message;

    successBox.style.display =
        "block";

}


/* =====================================================
   REFERRAL FROM URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const urlReferral =
    params.get("ref");

if(urlReferral){

    referralInput.value =
        urlReferral
        .trim()
        .toUpperCase();

}


/* =====================================================
   MOBILE INPUT
===================================================== */

mobileInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .replace(/\D/g,"")
            .slice(0,11);

    }
);


/* =====================================================
   REGISTER
===================================================== */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        errorBox.style.display =
            "none";

        successBox.style.display =
            "none";


        const name =
            nameInput.value.trim();

        const mobile =
            mobileInput.value.trim();

        const email =
            emailInput.value
            .trim()
            .toLowerCase();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;

        const referralCode =
            referralInput.value
            .trim()
            .toUpperCase();


        /* =========================================
           VALIDATION
        ========================================= */

        if(name.length < 2){

            showError(
                "Please enter your full name."
            );

            return;

        }


        if(!/^03[0-9]{9}$/.test(mobile)){

            showError(
                "Please enter a valid Pakistani mobile number. Example: 03001234567"
            );

            return;

        }


        if(password.length < 6){

            showError(
                "Password must contain at least 6 characters."
            );

            return;

        }


        if(password !== confirmPassword){

            showError(
                "Passwords do not match."
            );

            return;

        }


        button.disabled =
            true;

        button.innerText =
            "Checking...";


        try{


            /* =========================================
               CHECK MOBILE
            ========================================= */

            const usersSnapshot =
                await get(
                    ref(db,"users")
                );


            let users =
                usersSnapshot.exists()
                ? usersSnapshot.val()
                : {};


            let referrerId =
                "";

            let referrerUser =
                null;


            for(
                const id in users
            ){

                const user =
                    users[id];


                if(
                    String(
                        user.mobile || ""
                    ) === mobile
                ){

                    throw new Error(
                        "This mobile number is already registered."
                    );

                }


                if(
                    referralCode &&
                    String(
                        user.referralCode || ""
                    )
                    .toUpperCase()
                    === referralCode
                ){

                    referrerId =
                        id;

                    referrerUser =
                        user;

                }

            }


            /* =========================================
               CHECK REFERRAL
            ========================================= */

            if(
                referralCode &&
                !referrerUser
            ){

                throw new Error(
                    "Invalid referral code."
                );

            }


            /* =========================================
               CREATE FIREBASE AUTH USER
            ========================================= */

            button.innerText =
                "Creating account...";


            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const firebaseUser =
                userCredential.user;


            const uid =
                firebaseUser.uid;


            /* =========================================
               USER REFERRAL CODE
            ========================================= */

            const newReferralCode =
                "HE" +
                uid
                .replace(/[^a-zA-Z0-9]/g,"")
                .slice(-8)
                .toUpperCase();


            /* =========================================
               USER DATA
            ========================================= */

            const newUser = {

                id:uid,

                uid:uid,

                name:name,

                mobile:mobile,

                email:email,

                balance:0,

                todayReward:0,

                totalReward:0,

                selectedPlan:"",

                planAmount:0,

                adsCompleted:0,

                adsDate:
                    new Date()
                    .toDateString(),

                referralCode:
                    newReferralCode,

                referredBy:
                    referrerId
                    ? referralCode
                    : "",

                referralCount:0,

                referralReward:0,

                status:"active",

                createdAt:
                    new Date()
                    .toISOString()

            };


            /* =========================================
               SAVE USER
            ========================================= */

            await set(

                ref(
                    db,
                    "users/" + uid
                ),

                newUser

            );


            /* =========================================
               REFERRAL REWARD
            ========================================= */

            if(
                referrerId &&
                referrerUser
            ){

                const newBalance =
                    Number(
                        referrerUser.balance || 0
                    ) + 100;


                const newTotalReward =
                    Number(
                        referrerUser.totalReward || 0
                    ) + 100;


                const newReferralCount =
                    Number(
                        referrerUser.referralCount || 0
                    ) + 1;


                const newReferralReward =
                    Number(
                        referrerUser.referralReward || 0
                    ) + 100;


                await update(

                    ref(
                        db,
                        "users/" +
                        referrerId
                    ),

                    {

                        balance:
                            newBalance,

                        totalReward:
                            newTotalReward,

                        referralCount:
                            newReferralCount,

                        referralReward:
                            newReferralReward

                    }

                );


                /* =====================================
                   REFERRAL TRANSACTION
                ===================================== */

                await set(

                    ref(
                        db,
                        "transactions/" +
                        referrerId +
                        "/" +
                        Date.now()
                    ),

                    {

                        title:
                            "Referral Reward",

                        amount:100,

                        type:
                            "referral",

                        date:
                            new Date()
                            .toLocaleString()

                    }

                );

            }


            /* =========================================
               SAVE CURRENT USER
            ========================================= */

            localStorage.setItem(
                "Ham EarnCurrentUser",
                uid
            );

            localStorage.setItem(
                "currentUserId",
                uid
            );

            localStorage.setItem(
                "loggedInUser",
                uid
            );


            /* =========================================
               SUCCESS
            ========================================= */

            showSuccess(
                "Registration successful! Opening dashboard..."
            );


            button.innerText =
                "Account Created ✓";


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },1000);


        }catch(error){

            console.error(
                "Registration Error:",
                error
            );


            let message =
                "Unable to create account. Please try again.";


            if(
                error.code ===
                "auth/email-already-in-use"
            ){

                message =
                    "This email is already registered. Please login.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                message =
                    "Please enter a valid email address.";

            }

            else if(
                error.code ===
                "auth/weak-password"
            ){

                message =
                    "Password is too weak. Use at least 6 characters.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                message =
                    "Network error. Please check your internet connection.";

            }

            else if(error.message){

                message =
                    error.message;

            }


            showError(message);


            button.disabled =
                false;

            button.innerText =
                "Create Account";

        }

    }
);

</script>

</body>
</html>
