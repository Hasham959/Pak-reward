<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Ham Earn</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:32px;
    border-radius:18px;
    border:1px solid #e4e8ed;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#087443;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#697480;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d8dde4;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#087443;
    box-shadow:0 0 0 2px rgba(8,116,67,.08);
}

.password-row{
    position:relative;
}

.password-row input{
    padding-right:75px;
}

.show-btn{
    position:absolute;
    right:7px;
    top:7px;
    height:38px;
    padding:0 10px;
    border:none;
    border-radius:6px;
    background:#eef2f4;
    color:#087443;
    font-weight:bold;
    cursor:pointer;
}

.show-btn:hover{
    background:#e2e8eb;
}

.login-submit{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#087443;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-submit:hover{
    background:#065d35;
}

.login-submit:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.error{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:8px;
    background:#fff1ef;
    color:#c0392b;
    font-size:13px;
}

.success{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:8px;
    background:#eaf7f0;
    color:#087443;
    font-size:13px;
}

.register-link{
    text-align:center;
    margin-top:20px;
    color:#697480;
}

.register-link a{
    color:#087443;
    font-weight:bold;
    text-decoration:none;
}

.register-link a:hover{
    text-decoration:underline;
}

.home-link{
    display:block;
    text-align:center;
    margin-top:12px;
    color:#68737f;
    text-decoration:none;
    font-size:14px;
}

.home-link:hover{
    color:#087443;
}

.notice{
    margin-top:20px;
    padding:10px;
    background:#fff8e6;
    border-radius:8px;
    color:#806500;
    font-size:12px;
    text-align:center;
}

@media(max-width:450px){

    .login-box{
        padding:24px;
    }

    .logo{
        font-size:25px;
    }

}

</style>

</head>

<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">
        🇵🇰 Ham Earn
    </div>


    <div class="subtitle">
        Login to your account
    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <!-- PASSWORD -->

        <label>
            Password
        </label>

        <div class="password-row">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-btn"
                id="showBtn">

                Show

            </button>

        </div>


        <!-- ERROR -->

        <div
            class="error"
            id="error">
        </div>


        <!-- SUCCESS -->

        <div
            class="success"
            id="success">
        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-submit"
            id="loginButton">

            Login

        </button>


    </form>


    <!-- REGISTER -->

    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <!-- HOME -->

    <a
        href="index.html"
        class="home-link">

        ← Back to Home

    </a>


    <div class="notice">

        Demo system — account data is stored locally
        in this browser.

    </div>


</div>


<script>

/* =====================================================
   HAM EARN STORAGE KEYS
===================================================== */

const USERS_KEY =
    "Ham EarnUsers";

const CURRENT_USER_KEY =
    "Ham EarnCurrentUser";


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const showBtn =
    document.getElementById("showBtn");


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

showBtn.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            showBtn.innerText =
                "Hide";

        }else{

            passwordInput.type =
                "password";

            showBtn.innerText =
                "Show";

        }

    }
);


/* =====================================================
   PASSWORD HASH
===================================================== */

async function hashPassword(password){

    if(
        window.crypto &&
        window.crypto.subtle
    ){

        const data =
            new TextEncoder()
            .encode(password);


        const hash =
            await window.crypto.subtle.digest(
                "SHA-256",
                data
            );


        return Array.from(
            new Uint8Array(hash)
        )
        .map(function(byte){

            return byte
                .toString(16)
                .padStart(2,"0");

        })
        .join("");

    }


    /* Fallback */

    return password;

}


/* =====================================================
   GET USERS
===================================================== */

function getUsers(){

    try{

        const savedUsers =
            localStorage.getItem(
                USERS_KEY
            );


        if(!savedUsers){

            return [];

        }


        const users =
            JSON.parse(savedUsers);


        if(!Array.isArray(users)){

            return [];

        }


        return users;

    }catch(error){

        console.error(
            "Get Users Error:",
            error
        );

        return [];

    }

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message){

    successBox.style.display =
        "none";

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


/* =====================================================
   SHOW SUCCESS
===================================================== */

function showSuccess(message){

    errorBox.style.display =
        "none";

    successBox.innerText =
        message;

    successBox.style.display =
        "block";

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    loginUser
);


async function loginUser(event){

    event.preventDefault();


    /* CLEAR MESSAGES */

    errorBox.style.display =
        "none";

    successBox.style.display =
        "none";


    /* GET INPUT */

    const email =
        emailInput.value
        .trim()
        .toLowerCase();


    const password =
        passwordInput.value;


    /* VALIDATION */

    if(!email || !password){

        showError(
            "Please enter your email and password."
        );

        return;

    }


    /* DISABLE BUTTON */

    loginButton.disabled =
        true;

    loginButton.innerText =
        "Checking...";


    try{

        /* =============================================
           GET REGISTERED USERS
        ============================================= */

        const users =
            getUsers();


        /* =============================================
           NO USERS
        ============================================= */

        if(users.length === 0){

            showError(
                "No registered account found. Please register first."
            );

            loginButton.disabled =
                false;

            loginButton.innerText =
                "Login";

            return;

        }


        /* =============================================
           FIND USER
        ============================================= */

        const user =
            users.find(function(item){

                return String(
                    item.email || ""
                )
                .trim()
                .toLowerCase()
                === email;

            });


        /* =============================================
           USER NOT FOUND
        ============================================= */

        if(!user){

            showError(
                "No account found with this email. Please register first."
            );

            loginButton.disabled =
                false;

            loginButton.innerText =
                "Login";

            return;

        }


        /* =============================================
           CHECK PASSWORD
        ============================================= */

        const enteredHash =
            await hashPassword(password);


        const savedPassword =
            String(
                user.password || ""
            );


        let passwordCorrect =
            savedPassword ===
            enteredHash;


        /*
           Compatibility with
           older plain-password accounts
        */

        if(!passwordCorrect){

            passwordCorrect =
                savedPassword ===
                password;

        }


        /* =============================================
           WRONG PASSWORD
        ============================================= */

        if(!passwordCorrect){

            showError(
                "Incorrect password. Please try again."
            );

            loginButton.disabled =
                false;

            loginButton.innerText =
                "Login";

            return;

        }


        /* =============================================
           LOGIN SUCCESS
        ============================================= */

        const userId =
            String(user.id);


        /*
           MAIN CURRENT USER KEY
        */

        localStorage.setItem(
            CURRENT_USER_KEY,
            userId
        );


        /*
           COMPATIBILITY KEYS
        */

        localStorage.setItem(
            "currentUserId",
            userId
        );


        localStorage.setItem(
            "loggedInUser",
            userId
        );


        /* =============================================
           SUCCESS MESSAGE
        ============================================= */

        showSuccess(
            "Login successful! Opening dashboard..."
        );


        /* =============================================
           REDIRECT
        ============================================= */

        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },700);


    }catch(error){

        console.error(
            "Login Error:",
            error
        );


        showError(
            "Unable to login. Please try again."
        );


        loginButton.disabled =
            false;

        loginButton.innerText =
            "Login";

    }

}


/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            loginForm.requestSubmit();

        }

    }
);

</script>

</body>
</html>
