<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Ham Earn</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:32px;
    border-radius:18px;
    border:1px solid #e4e8ed;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#087443;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#697480;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d8dde4;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#087443;
    box-shadow:0 0 0 2px rgba(8,116,67,.08);
}

.password-row{
    position:relative;
}

.password-row input{
    padding-right:75px;
}

.show-btn{
    position:absolute;
    right:7px;
    top:7px;
    height:38px;
    padding:0 10px;
    border:none;
    border-radius:6px;
    background:#eef2f4;
    color:#087443;
    font-weight:bold;
    cursor:pointer;
}

.login-submit{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#087443;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-submit:hover{
    background:#065d35;
}

.login-submit:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.error{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:8px;
    background:#fff1ef;
    color:#c0392b;
    font-size:13px;
}

.success{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:8px;
    background:#eaf7f0;
    color:#087443;
    font-size:13px;
}

.register-link{
    text-align:center;
    margin-top:20px;
    color:#697480;
}

.register-link a{
    color:#087443;
    font-weight:bold;
    text-decoration:none;
}

.home-link{
    display:block;
    text-align:center;
    margin-top:12px;
    color:#68737f;
    text-decoration:none;
    font-size:14px;
}

.notice{
    margin-top:20px;
    padding:10px;
    background:#eaf7f0;
    border-radius:8px;
    color:#087443;
    font-size:12px;
    text-align:center;
}

.firebase-status{
    text-align:center;
    font-size:12px;
    margin-top:12px;
    color:#697480;
}

@media(max-width:450px){

    .login-box{
        padding:24px;
    }

    .logo{
        font-size:25px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        🇵🇰 Ham Earn
    </div>

    <div class="subtitle">
        Login to your account
    </div>


    <form id="loginForm">

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label>
            Password
        </label>

        <div class="password-row">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-btn"
                id="showBtn">

                Show

            </button>

        </div>


        <div
            class="error"
            id="error">
        </div>


        <div
            class="success"
            id="success">
        </div>


        <button
            type="submit"
            class="login-submit"
            id="loginButton">

            Login

        </button>

    </form>


    <div
        class="firebase-status"
        id="firebaseStatus">

        Connecting to Firebase...

    </div>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <a
        href="index.html"
        class="home-link">

        ← Back to Home

    </a>


    <div class="notice">

        ✓ Account data is connected with Firebase

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyD4pjKrlopXvk4peRnyid4DEItpPmU993Y",

    authDomain:
        "ham-earn.firebaseapp.com",

    databaseURL:
        "https://ham-earn-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "ham-earn",

    storageBucket:
        "ham-earn.firebasestorage.app",

    messagingSenderId:
        "411688505536",

    appId:
        "1:411688505536:web:c97f891314ee6f0dd65d25",

    measurementId:
        "G-J75NF5T10H"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const showBtn =
    document.getElementById("showBtn");

const firebaseStatus =
    document.getElementById("firebaseStatus");


/* =====================================================
   FIREBASE STATUS
===================================================== */

firebaseStatus.innerText =
    "✓ Firebase database connected";

firebaseStatus.style.color =
    "#087443";


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

showBtn.addEventListener(
    "click",
    function(){

        if(passwordInput.type === "password"){

            passwordInput.type = "text";

            showBtn.innerText = "Hide";

        }else{

            passwordInput.type = "password";

            showBtn.innerText = "Show";

        }

    }
);


/* =====================================================
   HASH PASSWORD
===================================================== */

async function hashPassword(password){

    const data =
        new TextEncoder()
        .encode(password);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array.from(
        new Uint8Array(hash)
    )
    .map(function(byte){

        return byte
            .toString(16)
            .padStart(2,"0");

    })
    .join("");

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message){

    successBox.style.display =
        "none";

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


/* =====================================================
   SHOW SUCCESS
===================================================== */

function showSuccess(message){

    errorBox.style.display =
        "none";

    successBox.innerText =
        message;

    successBox.style.display =
        "block";

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        errorBox.style.display =
            "none";

        successBox.style.display =
            "none";


        const email =
            emailInput.value
            .trim()
            .toLowerCase();


        const password =
            passwordInput.value;


        if(!email || !password){

            showError(
                "Please enter your email and password."
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.innerText =
            "Checking...";


        try{

            /* =========================================
               GET USERS FROM FIREBASE
            ========================================= */

            const usersRef =
                ref(db,"users");

            const snapshot =
                await get(usersRef);


            if(!snapshot.exists()){

                showError(
                    "No account found. Please register first."
                );

                loginButton.disabled =
                    false;

                loginButton.innerText =
                    "Login";

                return;

            }


            const users =
                snapshot.val() || {};


            /* =========================================
               FIND USER
            ========================================= */

            let foundUser = null;
            let foundUserId = null;


            for(
                const userId in users
            ){

                const user =
                    users[userId];


                const savedEmail =
                    String(
                        user.email || ""
                    )
                    .trim()
                    .toLowerCase();


                if(savedEmail === email){

                    foundUser =
                        user;

                    foundUserId =
                        userId;

                    break;

                }

            }


            /* =========================================
               ACCOUNT NOT FOUND
            ========================================= */

            if(!foundUser){

                showError(
                    "No account found with this email. Please register first."
                );

                loginButton.disabled =
                    false;

                loginButton.innerText =
                    "Login";

                return;

            }


            /* =========================================
               PASSWORD CHECK
            ========================================= */

            const enteredHash =
                await hashPassword(
                    password
                );


            const savedPassword =
                String(
                    foundUser.password || ""
                );


            if(savedPassword !== enteredHash){

                showError(
                    "Incorrect password. Please try again."
                );

                loginButton.disabled =
                    false;

                loginButton.innerText =
                    "Login";

                return;

            }


            /* =========================================
               SAVE CURRENT USER
            ========================================= */

            localStorage.setItem(
                "Ham EarnCurrentUser",
                foundUserId
            );


            localStorage.setItem(
                "currentUserId",
                foundUserId
            );


            localStorage.setItem(
                "loggedInUser",
                foundUserId
            );


            /* =========================================
               SUCCESS
            ========================================= */

            showSuccess(
                "Login successful! Opening dashboard..."
            );


            loginButton.innerText =
                "Login Successful ✓";


            /* =========================================
               DASHBOARD
            ========================================= */

            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },800);


        }catch(error){

            console.error(
                "Firebase Login Error:",
                error
            );


            showError(
                "Unable to connect with Firebase. Please check your internet connection."
            );


            loginButton.disabled =
                false;

            loginButton.innerText =
                "Login";

        }

    }
);

</script>

</body>
</html>
