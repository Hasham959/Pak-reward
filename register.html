<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Ham Earn</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.register-box{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:32px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
    border:1px solid #e4e8ed;
}

.logo{
    text-align:center;
    font-size:27px;
    font-weight:bold;
    color:#087443;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#697480;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d8dde4;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#087443;
    box-shadow:0 0 0 2px rgba(8,116,67,.08);
}

.register-btn{
    width:100%;
    margin-top:25px;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#087443;
    color:#fff;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.register-btn:hover{
    background:#075f37;
}

.register-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#697480;
}

.login-link a{
    color:#087443;
    font-weight:bold;
    text-decoration:none;
}

.login-link a:hover{
    text-decoration:underline;
}

.home-link{
    display:block;
    text-align:center;
    margin-top:12px;
    color:#68737f;
    text-decoration:none;
    font-size:14px;
}

.notice{
    margin-top:18px;
    padding:10px;
    background:#fff8e6;
    border-radius:8px;
    color:#806500;
    font-size:12px;
    text-align:center;
}

.error{
    color:#c0392b;
    font-size:13px;
    margin-top:10px;
    display:none;
    background:#fff1ef;
    padding:10px;
    border-radius:7px;
}

.success{
    color:#087443;
    font-size:13px;
    margin-top:10px;
    display:none;
    background:#eaf7f0;
    padding:10px;
    border-radius:7px;
}

.referral-box{
    background:#eaf7f0;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
    color:#087443;
    font-size:13px;
}

@media(max-width:500px){

    .register-box{
        padding:25px 20px;
    }

}

</style>

</head>

<body>


<div class="register-box">

    <div class="logo">
        🇵🇰 Ham Earn
    </div>

    <div class="subtitle">
        Create your account
    </div>


    <form id="registerForm">


        <!-- FULL NAME -->

        <label>
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
        >


        <!-- MOBILE -->

        <label>
            Mobile Number
        </label>

        <input
            type="tel"
            id="mobile"
            placeholder="03XXXXXXXXX"
            pattern="03[0-9]{9}"
            maxlength="11"
            inputmode="numeric"
            required
        >


        <!-- EMAIL -->

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <!-- PASSWORD -->

        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            minlength="6"
            autocomplete="new-password"
            required
        >


        <!-- CONFIRM PASSWORD -->

        <label>
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            minlength="6"
            autocomplete="new-password"
            required
        >


        <!-- REFERRAL -->

        <label>
            Referral Code
        </label>

        <input
            type="text"
            id="referralCode"
            placeholder="Enter referral code (optional)"
        >


        <div class="referral-box">
            💰 Referral reward: Rs. 100
        </div>


        <!-- MESSAGES -->

        <div
            class="error"
            id="error">
        </div>

        <div
            class="success"
            id="success">
        </div>


        <!-- BUTTON -->

        <button
            type="submit"
            class="register-btn"
            id="registerButton">

            Create Account

        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <a
        href="index.html"
        class="home-link">

        ← Back to Home

    </a>


    <div class="notice">

        Ham Earn Demo System

    </div>

</div>


<script>

/* =====================================================
   HAM EARN STORAGE KEYS
===================================================== */

const USERS_KEY = "Ham EarnUsers";

const CURRENT_USER_KEY = "Ham EarnCurrentUser";


/* =====================================================
   ELEMENTS
===================================================== */

const registerForm =
    document.getElementById("registerForm");

const nameInput =
    document.getElementById("name");

const mobileInput =
    document.getElementById("mobile");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const referralInput =
    document.getElementById("referralCode");

const registerButton =
    document.getElementById("registerButton");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");


/* =====================================================
   PASSWORD HASH
===================================================== */

async function hashPassword(password){

    if(
        window.crypto &&
        window.crypto.subtle
    ){

        const data =
            new TextEncoder()
            .encode(password);

        const hash =
            await window.crypto.subtle.digest(
                "SHA-256",
                data
            );

        return Array.from(
            new Uint8Array(hash)
        )
        .map(function(byte){

            return byte
                .toString(16)
                .padStart(2,"0");

        })
        .join("");

    }

    /* Fallback */

    return password;

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message){

    successBox.style.display = "none";

    errorBox.innerText = message;

    errorBox.style.display = "block";

}


/* =====================================================
   SHOW SUCCESS
===================================================== */

function showSuccess(message){

    errorBox.style.display = "none";

    successBox.innerText = message;

    successBox.style.display = "block";

}


/* =====================================================
   GET USERS
===================================================== */

function getUsers(){

    try{

        const savedUsers =
            localStorage.getItem(USERS_KEY);

        if(!savedUsers){

            return [];

        }

        const users =
            JSON.parse(savedUsers);

        if(!Array.isArray(users)){

            return [];

        }

        return users;

    }catch(error){

        console.error(
            "Get Users Error:",
            error
        );

        return [];

    }

}


/* =====================================================
   SAVE USERS
===================================================== */

function saveUsers(users){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

}


/* =====================================================
   LOAD REFERRAL CODE FROM URL
===================================================== */

function loadReferralCode(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("ref");

    if(code){

        referralInput.value =
            code
            .trim()
            .toUpperCase();

    }

}

loadReferralCode();


/* =====================================================
   REGISTER
===================================================== */

registerForm.addEventListener(
    "submit",
    registerUser
);


async function registerUser(event){

    event.preventDefault();


    /* CLEAR MESSAGES */

    errorBox.style.display = "none";

    successBox.style.display = "none";


    /* GET FORM DATA */

    const name =
        nameInput.value
        .trim();


    const mobile =
        mobileInput.value
        .trim();


    const email =
        emailInput.value
        .trim()
        .toLowerCase();


    const password =
        passwordInput.value;


    const confirmPassword =
        confirmPasswordInput.value;


    const referralCode =
        referralInput.value
        .trim()
        .toUpperCase();


    /* =================================================
       VALIDATION
    ================================================= */


    if(name.length < 2){

        showError(
            "Please enter your full name."
        );

        return;

    }


    if(!/^03[0-9]{9}$/.test(mobile)){

        showError(
            "Please enter a valid Pakistani mobile number. Example: 03001234567"
        );

        return;

    }


    if(password.length < 6){

        showError(
            "Password must contain at least 6 characters."
        );

        return;

    }


    if(password !== confirmPassword){

        showError(
            "Passwords do not match."
        );

        return;

    }


    /* =================================================
       LOAD USERS
    ================================================= */

    let users = getUsers();


    /* =================================================
       EMAIL CHECK
    ================================================= */

    const emailExists =
        users.some(function(user){

            return String(
                user.email || ""
            )
            .trim()
            .toLowerCase()
            === email;

        });


    if(emailExists){

        showError(
            "An account with this email already exists. Please login."
        );

        return;

    }


    /* =================================================
       MOBILE CHECK
    ================================================= */

    const mobileExists =
        users.some(function(user){

            return String(
                user.mobile || ""
            )
            .trim()
            === mobile;

        });


    if(mobileExists){

        showError(
            "This mobile number is already registered."
        );

        return;

    }


    /* =================================================
       FIND REFERRER
    ================================================= */

    let referrer = null;


    if(referralCode){

        referrer =
            users.find(function(user){

                return String(
                    user.referralCode || ""
                )
                .trim()
                .toUpperCase()
                === referralCode;

            });


        if(!referrer){

            showError(
                "Invalid referral code."
            );

            return;

        }

    }


    /* =================================================
       DISABLE BUTTON
    ================================================= */

    registerButton.disabled = true;

    registerButton.innerText =
        "Creating Account...";


    /* =================================================
       HASH PASSWORD
    ================================================= */

    let passwordHash;


    try{

        passwordHash =
            await hashPassword(password);

    }catch(error){

        console.error(
            "Password Hash Error:",
            error
        );

        registerButton.disabled = false;

        registerButton.innerText =
            "Create Account";

        showError(
            "Unable to create account. Please try again."
        );

        return;

    }


    /* =================================================
       CREATE UNIQUE USER ID
    ================================================= */

    const userId =
        Date.now().toString();


    /* =================================================
       CREATE REFERRAL CODE
    ================================================= */

    const newReferralCode =
        "HE" +
        userId.slice(-6);


    /* =================================================
       CREATE NEW USER
    ================================================= */

    const newUser = {

        id: userId,

        name: name,

        mobile: mobile,

        email: email,

        password: passwordHash,

        balance: 0,

        todayReward: 0,

        totalReward: 0,

        selectedPlan: "",

        planAmount: 0,

        adsCompleted: 0,

        adsDate:
            new Date().toDateString(),

        referralCode:
            newReferralCode,

        referredBy:
            referrer
            ? referrer.referralCode
            : "",

        referralCount: 0,

        referralReward: 0,

        createdAt:
            new Date().toISOString()

    };


    /* =================================================
       ADD NEW USER
    ================================================= */

    users.push(newUser);


    /* =================================================
       REFERRAL REWARD
    ================================================= */

    if(referrer){

        referrer.balance =
            Number(
                referrer.balance || 0
            ) + 100;


        referrer.totalReward =
            Number(
                referrer.totalReward || 0
            ) + 100;


        referrer.referralCount =
            Number(
                referrer.referralCount || 0
            ) + 1;


        referrer.referralReward =
            Number(
                referrer.referralReward || 0
            ) + 100;


        /* REFERRAL TRANSACTIONS */

        let transactions = [];


        try{

            transactions =
                JSON.parse(
                    localStorage.getItem(
                        "transactions_" +
                        referrer.id
                    ) || "[]"
                );

        }catch(error){

            transactions = [];

        }


        if(!Array.isArray(transactions)){

            transactions = [];

        }


        transactions.unshift({

            id:
                Date.now().toString(),

            title:
                "Referral Reward",

            amount: 100,

            type:
                "referral",

            date:
                new Date()
                .toLocaleString()

        });


        localStorage.setItem(

            "transactions_" +
            referrer.id,

            JSON.stringify(
                transactions.slice(0,20)
            )

        );

    }


    /* =================================================
       SAVE USER DATABASE
    ================================================= */

    saveUsers(users);


    /* =================================================
       LOGIN NEW USER AUTOMATICALLY
    ================================================= */

    localStorage.setItem(
        CURRENT_USER_KEY,
        userId
    );


    /*
       Compatibility keys
       for dashboard / old pages
    */

    localStorage.setItem(
        "currentUserId",
        userId
    );


    localStorage.setItem(
        "loggedInUser",
        userId
    );


    /* =================================================
       SUCCESS
    ================================================= */

    showSuccess(
        "Registration successful! Opening dashboard..."
    );


    setTimeout(function(){

        window.location.href =
            "dashboard.html";

    },700);

}


/* =====================================================
   MOBILE NUMBER ONLY
===================================================== */

mobileInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .replace(/\D/g,"")
            .slice(0,11);

    }
);

</script>

</body>
</html>
