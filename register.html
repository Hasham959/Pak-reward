<script>

/* =====================================================
   HAM EARN DATABASE KEY
===================================================== */

const USERS_KEY = "Ham EarnUsers";
const LOGIN_KEY = "Ham EarnCurrentUser";


/* =====================================================
   PASSWORD HASH
===================================================== */

async function hashPassword(password){

    const data =
        new TextEncoder().encode(password);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array.from(
        new Uint8Array(hash)
    )
    .map(byte =>
        byte
            .toString(16)
            .padStart(2,"0")
    )
    .join("");

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message){

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    success.style.display="none";

    error.innerText=message;

    error.style.display="block";

}


/* =====================================================
   SHOW SUCCESS
===================================================== */

function showSuccess(message){

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    error.style.display="none";

    success.innerText=message;

    success.style.display="block";

}


/* =====================================================
   LOAD REFERRAL FROM URL
===================================================== */

function loadReferralCode(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("ref");

    if(code){

        document.getElementById(
            "referralCode"
        ).value =
            code
            .toUpperCase()
            .trim();

    }

}

loadReferralCode();


/* =====================================================
   GET USERS
===================================================== */

function getUsers(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    USERS_KEY
                ) || "[]"
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


/* =====================================================
   SAVE USERS
===================================================== */

function saveUsers(users){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

}


/* =====================================================
   REGISTER
===================================================== */

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    registerUser
);


async function registerUser(event){

    event.preventDefault();


    const button =
        document.getElementById(
            "registerButton"
        );


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();


    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("password")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const referralCode =
        document
        .getElementById("referralCode")
        .value
        .trim()
        .toUpperCase();


    /* CLEAR OLD MESSAGE */

    document.getElementById(
        "error"
    ).style.display="none";


    document.getElementById(
        "success"
    ).style.display="none";


    /* VALIDATION */

    if(name.length<2){

        showError(
            "Please enter your full name."
        );

        return;

    }


    if(!/^03[0-9]{9}$/.test(mobile)){

        showError(
            "Please enter a valid Pakistani mobile number."
        );

        return;

    }


    if(password.length<6){

        showError(
            "Password must contain at least 6 characters."
        );

        return;

    }


    if(password !== confirmPassword){

        showError(
            "Passwords do not match."
        );

        return;

    }


    /* GET USERS */

    let users = getUsers();


    /* EMAIL CHECK */

    const emailExists =
        users.some(
            user =>
                String(user.email || "")
                .toLowerCase() === email
        );


    if(emailExists){

        showError(
            "An account with this email already exists."
        );

        return;

    }


    /* MOBILE CHECK */

    const mobileExists =
        users.some(
            user =>
                String(user.mobile || "") === mobile
        );


    if(mobileExists){

        showError(
            "This mobile number is already registered."
        );

        return;

    }


    /* REFERRER */

    let referrer = null;


    if(referralCode){

        referrer =
            users.find(
                user =>
                    String(
                        user.referralCode || ""
                    )
                    .toUpperCase() ===
                    referralCode
            );


        if(!referrer){

            showError(
                "Invalid referral code."
            );

            return;

        }

    }


    /* PASSWORD HASH */

    button.disabled=true;
    button.innerText="Creating Account...";


    let passwordHash;


    try{

        passwordHash =
            await hashPassword(password);

    }catch(error){

        button.disabled=false;
        button.innerText="Create Account";

        showError(
            "Unable to create account. Please try again."
        );

        return;

    }


    /* UNIQUE USER ID */

    const userId =
        Date.now().toString();


    /* REFERRAL CODE */

    const newReferralCode =
        "HE" +
        userId.slice(-6);


    /* NEW USER */

    const newUser = {

        id:userId,

        name:name,

        mobile:mobile,

        email:email,

        password:passwordHash,

        balance:0,

        todayReward:0,

        totalReward:0,

        selectedPlan:"",

        planAmount:0,

        adsCompleted:0,

        adsDate:new Date().toDateString(),

        referralCode:newReferralCode,

        referredBy:
            referrer
            ? referrer.referralCode
            : "",

        referralCount:0,

        referralReward:0,

        createdAt:
            new Date().toISOString()

    };


    /* ADD USER */

    users.push(newUser);


    /* =================================================
       REFERRAL REWARD
    ================================================= */

    if(referrer){

        referrer.balance =
            Number(
                referrer.balance || 0
            ) + 100;


        referrer.totalReward =
            Number(
                referrer.totalReward || 0
            ) + 100;


        referrer.referralCount =
            Number(
                referrer.referralCount || 0
            ) + 1;


        referrer.referralReward =
            Number(
                referrer.referralReward || 0
            ) + 100;


        /* REFERRAL TRANSACTION */

        let transactions=[];


        try{

            transactions =
                JSON.parse(
                    localStorage.getItem(
                        "transactions_" +
                        referrer.id
                    ) || "[]"
                );

        }catch(error){

            transactions=[];

        }


        if(!Array.isArray(transactions))
            transactions=[];


        transactions.unshift({

            id:
                Date.now().toString(),

            title:
                "Referral Reward",

            amount:100,

            type:"referral",

            date:
                new Date()
                .toLocaleString()

        });


        localStorage.setItem(

            "transactions_" +
            referrer.id,

            JSON.stringify(
                transactions.slice(0,20)
            )

        );

    }


    /* SAVE DATABASE */

    saveUsers(users);

/* LOGIN NEW USER */

localStorage.setItem(
    "Ham EarnCurrentUser",
    userId
);

/* COMPATIBILITY WITH LOGIN/DASHBOARD */

localStorage.setItem(
    "loggedInUser",
    userId
);

localStorage.setItem(
    "currentUserId",
    userId
);
