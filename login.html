<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PakReward</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f7fb;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 32px;

            border-radius: 18px;

            border: 1px solid #e4e8ed;

            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;

            font-size: 25px;

            font-weight: bold;

            color: #087443;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #697480;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d8dde4;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #087443;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #087443;

            color: white;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;
        }

        .register {
            text-align: center;

            margin-top: 20px;

            color: #697480;
        }

        .register a {
            color: #087443;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        🇵🇰 PakReward
    </div>

    <div class="subtitle">
        Login to your account
    </div>


    <form onsubmit="login(event)">

        <label>
            Email or Mobile Number
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter email or mobile"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script>

function login(event) {

    event.preventDefault();

    alert(
        "Demo login successful!"
    );

    window.location.href =
        "dashboard.html";

}

</script>

</body>
</html>
