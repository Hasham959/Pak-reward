<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - PakReward</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.register-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:32px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
    border:1px solid #e4e8ed;
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    color:#087443;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#697480;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d8dde4;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#087443;
}

.register-btn{
    width:100%;
    margin-top:25px;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#087443;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#697480;
}

.login-link a{
    color:#087443;
    font-weight:bold;
    text-decoration:none;
}

.notice{
    margin-top:18px;
    padding:10px;
    background:#fff8e6;
    border-radius:8px;
    color:#806500;
    font-size:12px;
    text-align:center;
}

.error{
    color:#c0392b;
    font-size:13px;
    margin-top:8px;
    display:none;
    background:#fff1ef;
    padding:9px;
    border-radius:7px;
}

.referral-box{
    background:#eaf7f0;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
    color:#087443;
    font-size:13px;
}
</style>
</head>

<body>

<div class="register-box">

<div class="logo">🇵🇰 PakReward</div>

<div class="subtitle">Create your account</div>

<form onsubmit="registerUser(event)">

<label>Full Name</label>
<input
type="text"
id="name"
placeholder="Enter your full name"
autocomplete="name"
required
>

<label>Mobile Number</label>
<input
type="tel"
id="mobile"
placeholder="03XXXXXXXXX"
pattern="03[0-9]{9}"
required
>

<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter your email"
autocomplete="email"
required
>

<label>Password</label>
<input
type="password"
id="password"
placeholder="Create password"
minlength="6"
required
>

<label>Confirm Password</label>
<input
type="password"
id="confirmPassword"
placeholder="Confirm password"
minlength="6"
required
>

<label>Referral Code</label>

<input
type="text"
id="referralCode"
placeholder="Enter referral code (optional)"
>

<div class="referral-box">
💰 Referral reward: Rs. 100
</div>

<div class="error" id="error"></div>

<button type="submit" class="register-btn">
Create Account
</button>

</form>

<div class="login-link">
Already have an account?
<a href="login.html">Login</a>
</div>

<div class="notice">
Demo system — data is stored locally in this browser.
</div>

</div>

<script>

async function hashPassword(password){

    const data=new TextEncoder().encode(password);

    const hash=await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return Array.from(
        new Uint8Array(hash)
    )
    .map(byte=>
        byte.toString(16).padStart(2,"0")
    )
    .join("");
}


function showError(message){

    const error=document.getElementById("error");

    error.innerText=message;
    error.style.display="block";
}


/* AUTO REFERRAL CODE FROM URL */

function loadReferralCode(){

    const params=
    new URLSearchParams(
        window.location.search
    );

    const code=
    params.get("ref");

    if(code){

        document.getElementById(
            "referralCode"
        ).value=code.toUpperCase();

    }
}

loadReferralCode();


async function registerUser(event){

    event.preventDefault();

    const name=
    document.getElementById("name")
    .value.trim();

    const mobile=
    document.getElementById("mobile")
    .value.trim();

    const email=
    document.getElementById("email")
    .value.trim()
    .toLowerCase();

    const password=
    document.getElementById("password")
    .value;

    const confirmPassword=
    document.getElementById("confirmPassword")
    .value;

    const enteredReferral=
    document.getElementById("referralCode")
    .value.trim()
    .toUpperCase();


    if(password!==confirmPassword){

        showError(
            "Passwords do not match."
        );

        return;
    }


    if(password.length<6){

        showError(
            "Password must contain at least 6 characters."
        );

        return;
    }


    let users=
    JSON.parse(
        localStorage.getItem(
            "pakrewardUsers"
        )||"[]"
    );

    if(!Array.isArray(users))
        users=[];


    const existingUser=
    users.find(
        user=>
        String(user.email||"")
        .toLowerCase()===email
    );


    if(existingUser){

        showError(
            "An account with this email already exists."
        );

        return;
    }


    const existingMobile=
    users.find(
        user=>
        String(user.mobile||"")===mobile
    );


    if(existingMobile){

        showError(
            "This mobile number is already registered."
        );

        return;
    }


    /* FIND REFERRER */

    let referrer=null;

    if(enteredReferral){

        referrer=
        users.find(
            user=>
            String(user.referralCode||"")
            .toUpperCase()===enteredReferral
        );


        if(!referrer){

            showError(
                "Invalid referral code."
            );

            return;
        }
    }


    const passwordHash=
    await hashPassword(password);


    const newUserId=
    Date.now();


    /* UNIQUE REFERRAL CODE */

    const newReferralCode=
    "PR"+newUserId.toString().slice(-6);


    const newUser={

        id:newUserId,

        name:name,

        mobile:mobile,

        email:email,

        password:passwordHash,

        balance:0,

        todayReward:0,

        totalReward:0,

        selectedPlan:"",

        planAmount:0,

        adsCompleted:0,

        adsDate:new Date().toDateString(),

        referralCode:newReferralCode,

        referredBy:referrer
            ?referrer.referralCode
            :"",

        referralCount:0,

        referralReward:0,

        createdAt:new Date().toISOString()

    };


    users.push(newUser);


    /*
       REFERRAL REWARD

       Rs.100 is given to referrer.
    */

    if(referrer){

        referrer.balance=
        Number(referrer.balance||0)+100;

        referrer.totalReward=
        Number(referrer.totalReward||0)+100;

        referrer.referralCount=
        Number(referrer.referralCount||0)+1;

        referrer.referralReward=
        Number(referrer.referralReward||0)+100;


        /* Referral transaction */

        let transactions=
        JSON.parse(
            localStorage.getItem(
                "transactions_"+referrer.id
            )||"[]"
        );

        if(!Array.isArray(transactions))
            transactions=[];


        transactions.unshift({

            title:
            "Referral Reward",

            amount:100,

            date:
            new Date().toLocaleString()

        });


        localStorage.setItem(
            "transactions_"+referrer.id,
            JSON.stringify(
                transactions.slice(0,20)
            )
        );
    }


    localStorage.setItem(
        "pakrewardUsers",
        JSON.stringify(users)
    );


    localStorage.setItem(
        "loggedInUser",
        String(newUser.id)
    );


    alert(
        "Registration successful!\n\n"+
        "Welcome, "+name+"!"
    );


    window.location.href=
    "dashboard.html";
}

</script>

</body>
</html>
